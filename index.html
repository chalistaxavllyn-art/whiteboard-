<!DOCTYPE html>
<html lang="id">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Papan Tulis Cute 🎀</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- Google Font Cute & Round -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Theme Light (Bawaan) */
      --bg-body: #fff5f7;
      --bg-toolbar: #ffe4e8;
      --border-toolbar: #ffccd5;
      --shadow-toolbar: rgba(255, 182, 193, 0.4);
      --bg-box: #ffffff;
      --border-box: #ffb3c1;
      --text-main: #ff758f;
      --text-bold: #ff4d6d;
      --text-input: #590d22;
      --bg-canvas: #ffffff;
    }

    [data-theme="dark"] {
      /* Theme Dark */
      --bg-body: #1a1829;
      --bg-toolbar: #2a2438;
      --border-toolbar: #3d3552;
      --shadow-toolbar: rgba(0, 0, 0, 0.5);
      --bg-box: #322b42;
      --border-box: #524368;
      --text-main: #ff9ebb;
      --text-bold: #ff758f;
      --text-input: #f0e6f5;
      --bg-canvas: #1e1b2e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', cursive, sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-body);
      display: flex;
      flex-direction: column;
    }

    /* TOOLBAR CUTE & BISA DIGESER */
    .toolbar {
      background: var(--bg-toolbar);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      overflow-x: auto;
      white-space: nowrap;
      box-shadow: 0 8px 20px var(--shadow-toolbar);
      z-index: 10;
      touch-action: pan-x;
      -webkit-overflow-scrolling: touch;
      border-bottom: 3px solid var(--border-toolbar);
    }

    .toolbar::-webkit-scrollbar {
      display: none;
    }

    /* BADGE ID */
    .status-box {
      background: var(--bg-box);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-main);
      border: 2px dashed var(--border-box);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-box strong {
      color: var(--text-bold);
    }

    .btn-edit-name {
      background: var(--border-box);
      color: var(--text-input);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      cursor: pointer;
      box-shadow: none;
    }

    /* GABUNG ID TEMAN */
    .join-box {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    input[type="text"] {
      padding: 8px 14px;
      border-radius: 20px;
      border: 2px solid var(--border-box);
      background: var(--bg-box);
      color: var(--text-input);
      font-size: 13px;
      outline: none;
      width: 130px;
    }

    input[type="text"]::placeholder {
      color: var(--text-main);
      opacity: 0.7;
    }

    /* TOMBOL BUBBLE CUTE */
    button {
      background: #ff758f;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(255, 117, 143, 0.3);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    button:active {
      transform: scale(0.92);
    }

    .btn-secondary {
      background: #b5e2fa;
      color: #0077b6;
      box-shadow: 0 4px 10px rgba(181, 226, 250, 0.5);
    }

    .btn-theme {
      background: #ffd166;
      color: #6d4c41;
      box-shadow: 0 4px 10px rgba(255, 209, 102, 0.4);
    }

    .btn-eraser {
      background: #e2afff;
      color: #6a040f;
      box-shadow: 0 4px 10px rgba(226, 175, 255, 0.5);
    }

    .btn-danger {
      background: #ff8fa3;
      color: white;
    }

    /* GROUP TOOLS */
    .tools-group {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
      background: var(--bg-box);
      padding: 6px 12px;
      border-radius: 20px;
      border: 2px solid var(--border-toolbar);
    }

    label {
      font-size: 12px;
      color: var(--text-main);
      font-weight: 600;
    }

    /* COLOR PICKER CUTE */
    input[type="color"] {
      border: 2px solid var(--border-box);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
      overflow: hidden;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 50%;
    }

    /* SLIDER UKURAN KUAS */
    .brush-size {
      width: 70px;
      accent-color: #ff758f;
    }

    /* CANVAS AREA */
    .canvas-container {
      flex: 1;
      position: relative;
      background: var(--bg-canvas);
      cursor: crosshair;
      touch-action: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <!-- TOOLBAR CUTE & AESTHETIC -->
  <div class="toolbar">
    <div class="status-box">
      <span>✨ ID (<span id="my-name">User</span>):</span> 
      <strong id="my-id">Memuat...</strong>
      <button class="btn-edit-name" onclick="editNama()">✏️ Edit</button>
    </div>

    <!-- TOMBOL MODE TERANG / GELAP -->
    <button class="btn-theme" onclick="toggleTheme()" id="theme-btn">🌙 Gelap</button>

    <div class="join-box">
      <input type="text" id="target-id" placeholder="ID Teman... 💬">
      <button class="btn-secondary" onclick="hubungkanKeTeman()">🌸 Gabung</button>
    </div>

    <div class="tools-group">
      <label for="color-picker">Warna</label>
      <input type="color" id="color-picker" value="#ff758f">

      <label for="brush-size">Kuas</label>
      <input type="range" id="brush-size" class="brush-size" min="1" max="40" value="6">

      <button onclick="pilihPena()">✏️ Pena</button>
      <button class="btn-eraser" onclick="pilihPenghapus()">🧽 Penghapus</button>
      <button class="btn-danger" onclick="bersihkanLayar(true)">🗑️ Bersih</button>
    </div>
  </div>

  <!-- AREA PAPAN TULIS -->
  <div class="canvas-container" id="canvas-container">
    <canvas id="whiteboard"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('whiteboard');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');
    const colorPicker = document.getElementById('color-picker');
    const brushSizeInput = document.getElementById('brush-size');
    const myIdEl = document.getElementById('my-id');
    const myNameEl = document.getElementById('my-name');
    const targetIdInput = document.getElementById('target-id');
    const themeBtn = document.getElementById('theme-btn');

    let peer = null;
    let conn = null;
    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;
    let isEraser = false;

    // --- TOGGLE MODE TERANG / GELAP ---
    let currentTheme = localStorage.getItem("whiteboardTheme") || "light";
    document.documentElement.setAttribute("data-theme", currentTheme);
    updateThemeButtonText();

    function toggleTheme() {
      currentTheme = currentTheme === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", currentTheme);
      localStorage.setItem("whiteboardTheme", currentTheme);
      updateThemeButtonText();
    }

    function updateThemeButtonText() {
      if (themeBtn) {
        themeBtn.innerText = currentTheme === "light" ? "🌙 Gelap" : "☀️ Terang";
      }
    }

    // --- SISTEM ID PERMANEN SAMA SEPERTI RCHAT ---
    let savedName = localStorage.getItem("whiteboardMyName");
    let savedId = localStorage.getItem("whiteboardMyId");

    if (!savedName) {
      savedName = (prompt("Masukkan nama kamu 🌸") || "User").trim() || "User";
      localStorage.setItem("whiteboardMyName", savedName);
    }

    function editNama() {
      const namaBaru = prompt("Masukkan nama baru kamu 🌸", savedName);
      if (namaBaru && namaBaru.trim() !== "") {
        savedName = namaBaru.trim();
        localStorage.setItem("whiteboardMyName", savedName);
        if (myNameEl) myNameEl.innerText = savedName;
        alert("Nama berhasil diubah! ✨");
      }
    }

    function buatIDDasar(nama) {
      return nama.toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 12) || "user";
    }

    function mulaiPeer() {
      if (myNameEl) myNameEl.innerText = savedName;

      if (savedId) {
        peer = new Peer(savedId);
      } else {
        const randomId = buatIDDasar(savedName) + "-" + Math.floor(1000 + Math.random() * 9000);
        peer = new Peer(randomId);
      }

      peer.on('open', id => {
        savedId = id;
        localStorage.setItem("whiteboardMyId", id);
        if (myIdEl) myIdEl.innerText = id;
      });

      peer.on('error', err => {
        console.error("PeerJS Error:", err);
        if (myIdEl) myIdEl.innerText = "Error koneksi";
      });

      peer.on('connection', c => {
        conn = c;
        alert("🎀 Temanmu berhasil bergabung ke papan tulis!");
        setupPenerimaData();
      });
    }

    mulaiPeer();

    // --- SINTAKS PAPAN TULIS & CANVAS ---
    function resizeCanvas() {
      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      tempCtx.drawImage(canvas, 0, 0);

      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;

      ctx.drawImage(tempCanvas, 0, 0);
      setupCanvasContext();
    }

    function setupCanvasContext() {
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }

    window.addEventListener('resize', resizeCanvas);

    function hubungkanKeTeman() {
      const targetId = targetIdInput.value.trim();
      if (!targetId) return alert("Isi ID Teman dulu ya! 🌸");
      
      conn = peer.connect(targetId);
      conn.on('open', () => {
        alert("💖 Berhasil terhubung ke papan tulis teman!");
        setupPenerimaData();
      });
    }

    function setupPenerimaData() {
      conn.on('data', data => {
        if (data.type === 'draw') {
          gambarGarisLokal(data.x0, data.y0, data.x1, data.y1, data.color, data.size);
        } else if (data.type === 'clear') {
          bersihkanLayar(false);
        }
      });
    }

    function mulaimenggambar(e) {
      isDrawing = true;
      const pos = dapatkanPosisi(e);
      lastX = pos.x;
      lastY = pos.y;
    }

    function menggambar(e) {
      if (!isDrawing) return;
      const pos = dapatkanPosisi(e);

      const x0 = lastX;
      const y0 = lastY;
      const x1 = pos.x;
      const y1 = pos.y;
      
      // Mengambil warna canvas sesuai mode (putih/gelap) saat penghapus aktif
      const bgCanvasColor = getComputedStyle(document.documentElement).getPropertyValue('--bg-canvas').trim();
      const color = isEraser ? bgCanvasColor : colorPicker.value;
      const size = brushSizeInput.value;

      gambarGarisLokal(x0, y0, x1, y1, color, size);

      if (conn && conn.open) {
        conn.send({
          type: 'draw',
          x0: x0 / canvas.width,
          y0: y0 / canvas.height,
          x1: x1 / canvas.width,
          y1: y1 / canvas.height,
          color: color,
          size: size
        });
      }

      lastX = x1;
      lastY = y1;
    }

    function stopMenggambar() {
      isDrawing = false;
    }

    function gambarGarisLokal(x0, y0, x1, y1, color, size) {
      const realX0 = x0 <= 1 ? x0 * canvas.width : x0;
      const realY0 = y0 <= 1 ? y0 * canvas.height : y0;
      const realX1 = x1 <= 1 ? x1 * canvas.width : x1;
      const realY1 = y1 <= 1 ? y1 * canvas.height : y1;

      ctx.beginPath();
      ctx.moveTo(realX0, realY0);
      ctx.lineTo(realX1, realY1);
      ctx.strokeStyle = color;
      ctx.lineWidth = size;
      ctx.stroke();
      ctx.closePath();
    }

    function dapatkanPosisi(e) {
      const rect = canvas.getBoundingClientRect();
      let clientX = e.clientX;
      let clientY = e.clientY;

      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      }

      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function pilihPena() {
      isEraser = false;
    }

    function pilihPenghapus() {
      isEraser = true;
    }

    function bersihkanLayar(kirimSinyal = true) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (kirimSinyal && conn && conn.open) {
        conn.send({ type: 'clear' });
      }
    }

    canvas.addEventListener('mousedown', mulaimenggambar);
    canvas.addEventListener('mousemove', menggambar);
    canvas.addEventListener('mouseup', stopMenggambar);
    canvas.addEventListener('mouseleave', stopMenggambar);

    canvas.addEventListener('touchstart', mulaimenggambar);
    canvas.addEventListener('touchmove', menggambar);
    canvas.addEventListener('touchend', stopMenggambar);

    resizeCanvas();
  </script>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>

</body>
</html>
